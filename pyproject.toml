[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "call-of-python"
version = "0.4.0"
description = "FPS retro en raycasting Python/pygame, jouable en solo et en cooperation LAN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "BLKMLO" }]
dependencies = ["pygame==2.6.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: First Person Shooters",
]

[project.optional-dependencies]
dev = ["coverage==7.15.4", "ruff==0.16.0"]
build = ["pyinstaller==6.22.0"]

[project.scripts]
call-of-python = "main:main"

[project.urls]
Repository = "https://github.com/BLKMLO/Call-Of-Python"
Issues = "https://github.com/BLKMLO/Call-Of-Python/issues"

[tool.setuptools]
py-modules = [
  "ai", "assets", "coop", "difficulty", "entities", "game", "gamepad",
  "hud", "level", "main", "menu", "network", "particles", "raycaster",
  "resources", "runtime", "settings", "sounds", "survival", "touch_controls", "version",
  "weapons", "objectives", "mission_marker", "upgrades", "upgrade_ui", "mutators",
]

[tool.setuptools.data-files]
"share/call-of-python/assets" = ["assets/*.png"]
"share/call-of-python/assets/sound" = ["assets/sound/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source_dirs = ["."]
omit = ["assets.py", "main.py", "tests/*", "build/*", "dist/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
